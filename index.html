<!DOCTYPE html>
<html xml:lang="tr" lang="tr">

<head>
	<title>awDOC | mADEMatik</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="awDOC — kelime işlemci. mADEMatik Solutions">
	<meta name="author" content="mADEMatik Solutions">
	<link rel="shortcut icon" href="img/favicon.svg" />
	<!-- Stiller ilk çizimden önce yüklenir. -->
	<link rel="stylesheet" href="/src/styles/app.css" />
	<link rel="stylesheet" href="/src/styles/titlebar.css" />
</head>

<body>
	<div id="toolbar" class="toolbar" role="toolbar" aria-label="Araçlar"></div>
	<div id="searchBar" class="search-bar" role="search" hidden>
		<div class="search-bar__row">
			<input id="searchInput" type="search" placeholder="Bul" aria-label="Bul" autocomplete="off">
			<span id="searchStatus" class="search-bar__status" aria-live="polite"></span>
			<button id="searchPrevious" class="secondary-button" type="button" aria-label="Önceki" title="Önceki (Shift+Enter)">↑</button>
			<button id="searchNext" class="secondary-button" type="button" aria-label="Sonraki" title="Sonraki (Enter)">↓</button>
			<button id="searchClose" class="secondary-button" type="button" aria-label="Kapat" title="Kapat (Esc)">✕</button>
		</div>
		<div id="replaceRow" class="search-bar__row" hidden>
			<input id="replaceInput" type="text" placeholder="Yerine" aria-label="Yerine yazılacak" autocomplete="off">
			<button id="replaceOne" class="secondary-button" type="button">Değiştir</button>
			<button id="replaceAll" class="secondary-button" type="button">Tümünü Değiştir</button>
		</div>
	</div>
	<main id="workspace" class="workspace">
		<div id="editorHost" class="editor-host"></div>
	</main>
	<input id="fileInput" type="file" hidden>
	<dialog id="unsavedDialog" class="dialog">
		<h2>Kaydedilmemiş değişiklikler</h2>
		<p id="unsavedMessage"></p>
		<form method="dialog" class="dialog__actions">
			<button value="save" class="primary-button">Kaydet</button>
			<button value="discard" class="secondary-button danger-button">Kaydetmeden devam et</button>
			<button value="cancel" class="secondary-button">Vazgeç</button>
		</form>
	</dialog>
	<dialog id="linkDialog" class="dialog" aria-labelledby="linkTitle">
		<h2 id="linkTitle">Bağlantı</h2>
		<form method="dialog">
			<label id="linkTextField" class="dialog__field">Görünen yazı
				<input id="linkText" type="text" autocomplete="off" placeholder="Boş bırakılırsa adres yazılır">
			</label>
			<label class="dialog__field">Adres
				<input id="linkUrl" type="text" inputmode="url" autocomplete="off" placeholder="ör. madematik.com">
				<span id="linkError" class="dialog__error" role="alert" hidden></span>
			</label>
			<div class="dialog__actions">
				<button value="save" class="primary-button">Tamam</button>
				<button id="linkOpen" value="open" class="secondary-button">Aç</button>
				<button id="linkRemove" value="remove" class="secondary-button danger-button" formnovalidate>Kaldır</button>
				<button value="cancel" class="secondary-button" formnovalidate>Vazgeç</button>
			</div>
		</form>
	</dialog>
	<dialog id="countDialog" class="dialog" aria-labelledby="countTitle">
		<h2 id="countTitle">Kelime sayısı</h2>
		<dl id="countList" class="count-list"></dl>
		<form method="dialog" class="dialog__actions">
			<button value="close" class="primary-button">Kapat</button>
		</form>
	</dialog>
	<!-- Hakkında (ailenin ortak penceresi: ad, sürüm, mADEMatik Solutions, indirme, lisans, gizlilik, iletişim) -->
	<dialog id="aboutDialog" class="dialog about-dialog" aria-labelledby="aboutTitle">
		<form method="dialog" class="about-dialog__header">
			<h2 id="aboutTitle">awDOC Hakkında</h2>
			<button value="close" class="about-dialog__close" title="Kapat" aria-label="Kapat">&times;</button>
		</form>
		<div class="about-dialog__body">
			<img class="about-dialog__icon" src="./img/app-icon.png" width="72" height="72" alt="">
			<p class="about-dialog__name"><strong>awDOC</strong> <span id="aboutVersion"></span></p>
			<p class="about-dialog__description">Kelime işlemci</p>
			<p class="about-dialog__maker"><a href="https://madematik.com"><span class="about-dialog__brand">m<span>ADEM</span>atik Solutions</span><br>madematik.com</a></p>
			<dl class="about-dialog__facts">
				<dt>İndir</dt>
				<dd><a href="https://madematik.com/projelerim/awdoc#indirmeler">Linux · Windows · Android</a></dd>
				<dt>Lisans</dt>
				<dd>MIT</dd>
				<dt>Gizlilik</dt>
				<dd><a href="https://madematik.com/awDOC/gizlilik.html">Gizlilik politikası</a></dd>
				<dt>İletişim</dt>
				<dd class="about-dialog__mail">ademvarol@madematik.com</dd>
			</dl>
		</div>
	</dialog>
	<div id="toast" class="toast" role="status" popover="manual" hidden></div>
	<script type="module" src="/src/main.ts"></script>
</body>

</html>
